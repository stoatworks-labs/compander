    <title>Compander — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Compander FFGL effect for Resolume in your browser: an analogue radio mic's companding circuit with a picture pushed through it, where the compander's time constant becomes a distance along the scan. The plugin's own eight GLSL shader programs, ported to WebGL2 unedited and run pass for pass on its half-float buffers, with its gain tables, control conversions and frame logic ported to JavaScript. No audio: the sidechain runs on silence. A demo, not the plugin." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/kit.css" />
    <link rel="canonical" href="https://compander-demo.stoatworks-labs.com/" />
  </head>
  <body>
    <main id="demo">
      <noscript>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/compander">its repository</a>.
        </p>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
    <script
      src="./vendor/support-footer.js"
      defer
      data-app="Compander"
      data-repo="https://github.com/stoatworks-labs/compander"
      data-note="A browser demo of the plugin's shaders over a port of its CPU half. Nothing you load here leaves your machine."
    ></script>
  </body>
