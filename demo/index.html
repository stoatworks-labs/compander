  <body>
    <main id="demo">
      <noscript>
        <h1>Compander</h1>
        <p>
          An analogue radio mic's companding circuit with a picture pushed
          through it, as an FFGL effect for Resolume and an OpenFX plugin for
          Resolve. Apply a compander's attack and release to video and they
          become a distance along the scan, so one control runs from a halo
          hugging every edge all the way to the whole picture pumping.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/compander">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/compander/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/compander">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
